<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINTA Predictor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">

  
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7">
                <div class="glass border border-slate-200 rounded-3xl p-6 shadow-xl shadow-slate-200/50">
                    <label class="block mb-4 text-sm font-bold text-slate-700 uppercase tracking-widest italic">Tempel Teks Artikel Lengkap:</label>
                    <textarea id="inputText" class="w-full h-[450px] p-5 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none text-sm leading-relaxed mb-4 bg-slate-50/50" placeholder="Salin mulai dari Judul, Abstrak, sampai Referensi..."></textarea>
                    
                    <button onclick="analyzeText()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
                        🔍 Mulai Analisis Script
                    </button>
                </div>
            </div>

            <div class="lg:col-span-5">
                <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center p-10 bg-slate-100/50 rounded-3xl border-2 border-dashed border-slate-200">
                    <p class="text-slate-400 font-medium">Panel Hasil Analisis</p>
                </div>

                <div id="resultArea" class="hidden glass border border-slate-200 rounded-3xl p-8 shadow-2xl sticky top-10">
                    <div class="text-center mb-8">
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400 mb-2 italic">Estimasi Hasil</p>
                        <h2 id="resLevel" class="text-6xl font-black mb-4 italic">-</h2>
                        <div id="scoreBadge" class="inline-block px-8 py-2 rounded-full text-white font-bold text-xl shadow-md">
                            SCORE: <span id="scoreValue">0</span>
                        </div>
                    </div>

                    <div class="space-y-3 mb-8">
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <span class="text-xs font-bold text-slate-400 uppercase">Jumlah Kata</span>
                            <span id="statWords" class="text-sm font-bold text-slate-800">-</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <span class="text-xs font-bold text-slate-400 uppercase">Referensi</span>
                            <span id="statRefs" class="text-sm font-bold text-slate-800">-</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <span class="text-xs font-bold text-slate-400 uppercase">Bahasa Inggris</span>
                            <span id="statLang" class="text-sm font-bold text-slate-800">-</span>
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <span class="text-xs font-bold text-slate-400 uppercase">Struktur IMRAD</span>
                            <span id="statImrad" class="text-sm font-bold text-slate-800">-</span>
                        </div>
                    </div>

                    <div id="adviceCard" class="p-6 rounded-2xl border-l-8">
                        <p id="adviceText" class="text-sm font-medium leading-relaxed italic text-slate-700"></p>
                    </div>

                    <button onclick="location.reload()" class="w-full mt-8 text-slate-400 hover:text-slate-600 text-[10px] font-black uppercase tracking-widest">Ulangi Analisis</button>
                </div>
            </div>
        </div>

        <div class="mt-16 text-center">
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.4em]">
                Acuan: Penilaian Smart Analysis (Score Based)
            </p>
        </div>
    </div>

    <script>
        function analyzeText() {
            const text = document.getElementById('inputText').value;
            if (text.length < 200) return alert("Teks artikel terlalu pendek.");

            document.getElementById('welcomeMessage').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');

            const words = text.trim().split(/\s+/).length;
            const lowerText = text.toLowerCase();
            
            // LOGIKA IMRAD (PERSIS SCRIPT)
            const sections = {
                intro: /introduction|pendahuluan/.test(lowerText),
                method: /method|metode/.test(lowerText),
                results: /result|hasil/.test(lowerText),
                discussion: /discussion|pembahasan/.test(lowerText),
                conclusion: /conclusion|kesimpulan/.test(lowerText)
            };
            const sectionCount = Object.values(sections).filter(Boolean).length;
            
            // LOGIKA BAHASA (PERSIS SCRIPT)
            const isEnglish = /abstract|research|background/.test(lowerText) && !/abstrak|penelitian|latar belakang/.test(lowerText);
            
            // LOGIKA REFERENSI (PERSIS SCRIPT)
            const refs = (text.match(/\[\d+\]|\(\d{4}\)/g) || []).length;

            // PERHITUNGAN SKOR (PERSIS SCRIPT)
            let score = 0;
            if (isEnglish) score += 25;
            if (words > 3000) score += 20; else if (words > 1500) score += 10;
            if (refs > 20) score += 30; else if (refs > 10) score += 15;
            if (sectionCount >= 4) score += 25;

            // PENENTUAN LEVEL & WARNA (PERSIS SCRIPT)
            let level = "SINTA 5-6";
            let color = "#64748b";
            let advice = "Draf artikel memenuhi kriteria dasar. Fokus pada penguatan Gap Research dan perbanyak referensi jurnal internasional.";

            if (score >= 80) { 
                level = "SINTA 1"; color = "#ef4444"; 
                advice = "Luar biasa! Struktur dan bobot artikel sudah standar internasional. Layak kirim ke jurnal bereputasi tinggi.";
            } else if (score >= 65) { 
                level = "SINTA 2"; color = "#f59e0b"; 
                advice = "Sangat baik. Tambahkan analisis lebih dalam di bagian pembahasan (discussion) untuk memperkuat hasil.";
            } else if (score >= 50) { 
                level = "SINTA 3-4"; color = "#10b981"; 
                advice = "Kualitas artikel sudah standar nasional terakreditasi. Perbaiki sitasi agar lebih update.";
            }

            // UPDATE UI
            document.getElementById('resLevel').innerText = level;
            document.getElementById('resLevel').style.color = color;
            document.getElementById('scoreBadge').style.backgroundColor = color;
            document.getElementById('scoreValue').innerText = score;
            
            document.getElementById('statWords').innerText = words + " Kata";
            document.getElementById('statRefs').innerText = refs + " Sitasi";
            document.getElementById('statLang').innerText = isEnglish ? "Ya (Inggris)" : "Tidak (Indonesia)";
            document.getElementById('statImrad').innerText = sectionCount + "/5 Terpenuhi";

            const advCard = document.getElementById('adviceCard');
            advCard.style.backgroundColor = color + '15';
            advCard.style.borderColor = color;
            document.getElementById('adviceText').innerText = advice;
        }
    </script>
</body>
</html>
