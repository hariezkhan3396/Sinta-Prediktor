<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINTA Predictor - Versi Konsisten</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">

    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">SINTA <span class="text-indigo-600">Predictor Pro</span></h1>
            <p class="text-slate-500 mt-2 font-medium italic">Sistem Prediksi Berdasarkan Kisaran Skor Akreditasi</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7">
                <div class="glass border border-slate-200 rounded-3xl p-6 shadow-xl">
                    <label class="block mb-4 text-xs font-black text-slate-400 uppercase tracking-[0.2em]">Tempel Manuskrip Lengkap</label>
                    <textarea id="inputText" class="w-full h-[500px] p-5 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none text-sm leading-relaxed mb-4 bg-slate-50/50" placeholder="Copy-paste draf artikel Anda di sini..."></textarea>
                    
                    <button onclick="analyzeText()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition-all shadow-lg active:scale-95 flex items-center justify-center gap-2">
                        📊 Hitung Skor & Prediksi
                    </button>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
                
                <div id="resultArea" class="hidden glass border border-slate-200 rounded-3xl p-8 shadow-2xl sticky top-6">
                    <div class="text-center mb-6">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Hasil Prediksi</p>
                        <h2 id="resLevel" class="text-6xl font-black mb-4 italic tracking-tighter">-</h2>
                        <div id="scoreBadge" class="inline-block px-10 py-2 rounded-full text-white font-black text-2xl shadow-lg">
                            SKOR: <span id="scoreValue">0</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-6 text-center">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Struktur</p>
                            <p id="statImrad" class="font-bold text-slate-700 text-xs">-</p>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Bahasa</p>
                            <p id="statLang" class="font-bold text-slate-700 text-xs">-</p>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-6">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-widest text-center">Tabel Acuan Prediksi</p>
                        <div class="space-y-2">
                            <div class="flex justify-between items-center p-2 rounded-lg bg-red-50 text-red-700 text-xs font-bold">
                                <span>SINTA 1</span>
                                <span>Skor: 80 - 100</span>
                            </div>
                            <div class="flex justify-between items-center p-2 rounded-lg bg-amber-50 text-amber-700 text-xs font-bold">
                                <span>SINTA 2</span>
                                <span>Skor: 65 - 79</span>
                            </div>
                            <div class="flex justify-between items-center p-2 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-bold">
                                <span>SINTA 3-4</span>
                                <span>Skor: 50 - 64</span>
                            </div>
                            <div class="flex justify-between items-center p-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold">
                                <span>SINTA 5-6</span>
                                <span>Skor: < 50</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="location.reload()" class="w-full mt-8 text-slate-400 hover:text-indigo-600 text-[10px] font-black uppercase tracking-widest transition-colors">Analisis Ulang</button>
                </div>

                <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center p-10 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <p class="text-slate-400 text-sm font-medium">Data prediksi akan ditampilkan di sini.</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        function analyzeText() {
            const text = document.getElementById('inputText').value;
            if (text.length < 200) return alert("Teks artikel terlalu pendek.");

            document.getElementById('welcomeMessage').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');

            const words = text.trim().split(/\s+/).length;
            const lowerText = text.toLowerCase();
            
            // Logika IMRAD (Acuan Script Bapak/Ibu)
            const sections = {
                intro: /introduction|pendahuluan/.test(lowerText),
                method: /method|metode/.test(lowerText),
                results: /result|hasil/.test(lowerText),
                discussion: /discussion|pembahasan/.test(lowerText),
                conclusion: /conclusion|kesimpulan/.test(lowerText)
            };
            const sectionCount = Object.values(sections).filter(Boolean).length;
            
            // Logika Bahasa (Acuan Script Bapak/Ibu)
            const isEnglish = /abstract|research|background/.test(lowerText) && !/abstrak|penelitian|latar belakang/.test(lowerText);
            
            // Logika Referensi (Acuan Script Bapak/Ibu)
            const refs = (text.match(/\[\d+\]|\(\d{4}\)/g) || []).length;

            // PERHITUNGAN SKOR (PERSIS SCRIPT)
            let score = 0;
            if (isEnglish) score += 25;
            if (words > 3000) score += 20; else if (words > 1500) score += 10;
            if (refs > 20) score += 30; else if (refs > 10) score += 15;
            if (sectionCount >= 4) score += 25;

            // KLASIFIKASI KONSISTEN (Sesuai Kisaran Nilai)
            let level = "SINTA 5-6";
            let color = "#64748b"; // Slate

            if (score >= 80) { 
                level = "SINTA 1"; color = "#ef4444"; // Red
            } else if (score >= 65) { 
                level = "SINTA 2"; color = "#f59e0b"; // Amber
            } else if (score >= 50) { 
                level = "SINTA 3-4"; color = "#10b981"; // Emerald
            }

            // Update UI
            document.getElementById('resLevel').innerText = level;
            document.getElementById('resLevel').style.color = color;
            document.getElementById('scoreBadge').style.backgroundColor = color;
            document.getElementById('scoreValue').innerText = score;
            
            document.getElementById('statImrad').innerText = sectionCount + "/5 Bagian";
            document.getElementById('statLang').innerText = isEnglish ? "Inggris (Full)" : "Indonesia";
        }
    </script>
</body>
</html>
