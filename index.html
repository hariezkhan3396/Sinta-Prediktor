<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SINTA Expert Predictor </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">SINTA <span class="text-indigo-600">Expert Predictor</span></h1>
            <p class="text-slate-500 mt-3 font-medium tracking-wide italic">Analisis Prediksi Kualitas Artikel</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7">
                <div class="glass border border-slate-200 rounded-3xl p-6 shadow-xl shadow-slate-200/50">
                    <label class="block mb-4 text-xs font-black text-slate-400 uppercase tracking-widest italic text-center md:text-left">Input Teks Manuskrip Lengkap:</label>
                    <textarea id="inputText" class="w-full h-[500px] p-5 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none text-sm leading-relaxed mb-4 bg-slate-50/50" placeholder="Tempelkan draf artikel Anda (Judul sampai Referensi)..."></textarea>
                    
                    <button onclick="analyzeText()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl transition-all shadow-lg shadow-indigo-200 active:scale-95 flex items-center justify-center gap-2">
                        🔍 Jalankan Smart Analysis
                    </button>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6">
                <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center p-10 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <p class="text-slate-400 font-medium italic">Hasil prediksi skor akan ditampilkan di panel ini setelah analisis dilakukan.</p>
                </div>

                <div id="resultArea" class="hidden glass border border-slate-200 rounded-3xl p-8 shadow-2xl sticky top-6">
                    <div class="text-center mb-8">
                        <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2 italic">Estimasi Peringkat</p>
                        <h2 id="resLevel" class="text-6xl font-black mb-4 italic tracking-tighter">-</h2>
                        <div id="scoreBadge" class="inline-block px-10 py-2 rounded-full text-white font-black text-2xl shadow-lg">
                            SKOR: <span id="scoreValue">0</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-8">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center">
                            <p class="text-[9px] text-slate-400 font-black uppercase italic">Jumlah Kata</p>
                            <p id="statWords" class="font-bold text-slate-700 text-xs">-</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center">
                            <p class="text-[9px] text-slate-400 font-black uppercase italic">Struktur</p>
                            <p id="statImrad" class="font-bold text-slate-700 text-xs">-</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center col-span-2">
                            <p class="text-[9px] text-slate-400 font-black uppercase italic">Sitasi Unik Terdeteksi</p>
                            <p id="statRefs" class="font-bold text-slate-700 text-xs">-</p>
                        </div>
                    </div>

                    <div id="adviceCard" class="p-6 rounded-2xl border-l-8">
                        <h4 class="font-black text-slate-800 mb-2 text-[10px] uppercase tracking-widest italic">Catatan Reviewer:</h4>
                        <p id="adviceText" class="text-sm italic leading-relaxed text-slate-600"></p>
                    </div>

                    <button onclick="location.reload()" class="w-full mt-8 text-slate-400 hover:text-indigo-600 text-[10px] font-black uppercase tracking-widest transition-colors">Ulangi Analisis</button>
                </div>
            </div>
        </div>

        <div class="mt-16 text-center">
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.4em]">
                Pendamping Publikasi Dosen 
            </p>
        </div>
    </div>

    <script>
        function analyzeText() {
            const text = document.getElementById('inputText').value;
            if (text.length < 300) return alert("Manuskrip terlalu pendek untuk dianalisis.");

            document.getElementById('welcomeMessage').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');

            const lowerText = text.toLowerCase();
            const words = text.trim().split(/\s+/).length;
            
            // 1. CEK IMRAD
            const sections = {
                intro: /introduction|pendahuluan/.test(lowerText),
                method: /method|metode/.test(lowerText),
                results: /result|hasil/.test(lowerText),
                discussion: /discussion|pembahasan/.test(lowerText),
                conclusion: /conclusion|kesimpulan/.test(lowerText)
            };
            const sectionCount = Object.values(sections).filter(Boolean).length;
            
            // 2. CEK BAHASA
            const isEnglish = /abstract|research|background/.test(lowerText) && !/abstrak|penelitian|latar belakang/.test(lowerText);
            
            // 3. CEK REFERENSI (Unique Refs)
            const citationPattern = /\[[\d, \-]+\]|\(\b(?:[A-Z][a-z]+(?:\s+et\s+al\.)?|[\w\s,]+)\s*,\s*\d{4}\)|\(\d{4}\)/g;
            const allMatches = text.match(citationPattern) || [];
            const refsCount = [...new Set(allMatches)].length;

            // --- LOGIKA SKOR ASLI BAPAK (STRICT) ---
            let score = 0;
            if (isEnglish) score += 25;
            
            if (words > 3000) score += 20; 
            else if (words > 1500) score += 10;
            
            // Skor maksimal jika > 20 (Persis permintaan Bapak)
            if (refsCount > 20) score += 30; 
            else if (refsCount > 10) score += 15;
            else score += 5;
            
            if (sectionCount >= 4) score += 25;

            // --- KLASIFIKASI PENENTUAN LEVEL ---
            let level = "SINTA 5-6";
            let color = "#64748b";
            let advice = "Draf artikel memenuhi kriteria dasar. Fokus pada penguatan Gap Research dan perbanyak referensi jurnal internasional terbaru.";

            if (score >= 80) { 
                level = "SINTA 1"; color = "#ef4444"; 
                advice = "Luar biasa! Struktur dan bobot artikel sudah standar internasional. Sangat potensial untuk jurnal bereputasi tinggi.";
            } else if (score >= 65) { 
                level = "SINTA 2"; color = "#f59e0b"; 
                advice = "Sangat baik. Tambahkan analisis lebih dalam di bagian pembahasan (discussion) untuk memperkuat kontribusi substansi.";
            } else if (score >= 50) { 
                level = "SINTA 3-4"; color = "#10b981"; 
                advice = "Kualitas artikel sudah standar nasional terakreditasi. Perlu penguatan pada kemutakhiran referensi.";
            }

            // UPDATE TAMPILAN (UI)
            document.getElementById('resLevel').innerText = level;
            document.getElementById('resLevel').style.color = color;
            document.getElementById('scoreBadge').style.backgroundColor = color;
            document.getElementById('scoreValue').innerText = score;
            
            document.getElementById('statWords').innerText = words + " Kata";
            document.getElementById('statImrad').innerText = sectionCount + "/5 Bagian";
            document.getElementById('statRefs').innerText = refsCount + " Referensi Unik";

            const advCard = document.getElementById('adviceCard');
            advCard.style.backgroundColor = color + '15';
            advCard.style.borderColor = color;
            document.getElementById('adviceText').innerText = advice;
        }
    </script>
</body>
</html>
